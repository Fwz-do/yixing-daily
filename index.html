<script>
(function(){
  var PW="123456", KEY="yx_daily_0730_ok";
  var gate=document.getElementById('pass-gate'),inp=document.getElementById('pass-input'),
      err=document.getElementById('pass-err'),btn=document.getElementById('pass-btn');
  function unlock(){gate.parentNode.removeChild(gate);document.body.style.overflow='';}
  function tryPw(){if(inp.value===PW){try{sessionStorage.setItem(KEY,'1')}catch(e){}unlock();}else{err.style.display='block';inp.value='';inp.focus();}}
  try{if(sessionStorage.getItem(KEY)==='1'){unlock();return;}}catch(e){}
  document.body.style.overflow='hidden';
  btn.addEventListener('click',tryPw);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});
  setTimeout(function(){inp.focus();},300);
})();
</script>

const DATA_G500=[{"co":"中芯国际","ind":"半导体/晶圆代工","type":"财报","date":"08-14","title":"中芯国际二季度收入首破30亿美元，赵海军：AI配套芯片需求激增带动量价齐升","summary":"8月14日业绩说明会上，中芯国际CEO赵海军表示，二季度晶圆量价齐升，单季收入30.06亿美元创历史新高，环比增长20%、同比增长36.1%，毛利率25.3%环比提升5.2个百分点。出货量增长主要源于人工智能对配套芯片需求的激增与客户提拉出货，公司新增8000片12英寸月产能，产能利用率93.7%。针对产能紧缺领域，公司与客户协商提价。三季度收入指引环比增长2%至4%，毛利率指引26%至28%。","rel":"中芯国际产能利用率高位运行并针对AI配套等紧缺领域提价，印证国产晶圆制造进入景气上行通道。对宜兴而言，晶圆代工扩产与AI芯片放量将拉动上游硅片、光刻胶、特种气体、封装基板等材料需求，宜兴在电子化学品和半导体材料领域已有基础，应紧盯中芯国际及国内晶圆厂扩产节奏，定向招引配套材料与设备零部件企业落户，切入国产替代供应链。同时提价趋势也提示下游设计企业成本承压，需关注产业链利润分配变化。","city":"上海","src":"新浪财经（21世纪经济报道）","url":"https://finance.sina.com.cn/roll/2026-08-14/doc-ininhhrt9383985.shtml"},{"co":"联想集团","ind":"计算机/AI服务器","type":"财报","date":"08-14","title":"联想AI服务器订单储备超540亿美元，杨元庆：AI远未达泡沫阶段","summary":"联想披露2026/27财年第一财季业绩后，杨元庆在业绩沟通会上表示，AI服务器订单储备从上季度210亿美元增至超540亿美元，环比增长2.6倍。当季营收269.43亿美元同比增长43%，经调整净利润10.75亿美元同比增176%，首破10亿美元；AI相关业务收入同比增60%至634亿元，占营收约35%。杨元庆称AI尚未达泡沫阶段，只是局部过热，今年有望提前达成千亿美元营收目标。","rel":"联想AI服务器订单储备540亿美元印证全球AI算力硬件需求强劲，服务器、液冷、供配电产业链进入高景气周期。宜兴可围绕AI服务器配套的精密结构件、散热模组、特种线缆及电源等环节布局招商，同时联想“全球资源、本地交付”模式为宜兴制造企业融入全球AI供应链提供了路径参考。其强调供应链尤其是存储仍是订单转化瓶颈，宜兴电缆、环保企业可关注数据中心供配电、液冷散热等确定性配套需求。","city":"北京","src":"每日经济新闻","url":"https://finance.sina.cn/2026-08-14/detail-ininfvzx9502376.d.html"},{"co":"华为","ind":"消费电子/智能穿戴","type":"产品发布","date":"08-14","title":"华为WATCH GT 7智能手表正式开售，1588元起主打滑雪与健康监测","summary":"8月14日，华为WATCH GT 7智能手表正式开售，提供41mm/46mm两种规格，售价1588元起。新品搭载腕上室内滑雪模式，支持单板、双板滑雪，可自动记录最大速度、平均坡度、累计下降等数据，并支持全球超3000个腕上雪场地图；41mm版常规续航7天、46mm版12天。此外还支持骑行爬坡规划、脉搏波房颤及早搏风险提示、睡眠呼吸暂停检测等功能。","rel":"华为穿戴新品围绕运动健康与全场景生态持续迭代，反映头部终端厂商将健康监测作为高端硬件差异化核心抓手。对宜兴而言，智能穿戴放量将拉动精密传感器、柔性电路板、微型电池、精密结构件等上游配套需求，宜兴可依托精密制造基础对接华为及国内穿戴设备供应链，招引传感器模组、精密注塑结构件等企业。同时华为鸿蒙生态“设备+服务”模式提示，本地制造企业可探索接入头部生态实现产品智能化升级的路径。","city":"深圳","src":"IT之家（网易）","url":"https://www.163.com/dy/article/L49H36EI0511B8LM.html"},{"co":"特斯拉","ind":"新能源汽车/AI算力","type":"战略转型","date":"08-14","title":"马斯克大力转向化石能源：SpaceX建天然气电厂为AI数据中心供电","summary":"据新浪财经报道，马斯克大规模依靠天然气涡轮机组为SpaceX人工智能业务的数据中心扩建供电，并计划在得州格莱姆斯县新建天然气发电厂，为当地在建的超大型芯片工厂供能。马斯克在8月4日投资者电话会上表示，到2027年底自备发电规模或扩张至约10至15吉瓦。十年前马斯克曾称燃烧化石燃料是“史上最愚蠢的实验”，如今特斯拉官方标语已删除“可持续”一词。","rel":"马斯克从电动车向AI算力、化石能源的战略转向，折射全球AI数据中心爆发对稳定供电的刚性需求，以及“离网自备电源”模式的兴起。对宜兴的启示有二：一是AI算力扩张带来巨量绿色电力与储能配套需求，宜兴可发挥光伏、储能产业基础承接数据中心绿电配套；二是“自备电源”趋势提示，招引智算中心项目时应同步规划分布式能源与储能配套，以能源保障能力作为招商差异化竞争力。同时能源路线反复也警示单一技术押注的风险。","city":"得州","src":"新浪财经（环球市场播报）","url":"https://finance.sina.com.cn/stock/usstock/c/2026-08-14/doc-inineywi9828348.shtml"},{"co":"苹果","ind":"消费电子/AI","type":"战略合作","date":"08-14","title":"苹果被曝为中国市场训练自有大模型，阿里提供支持","summary":"8月14日路透社援引三名知情人士称，苹果已为中国市场训练了一款大语言模型，阿里巴巴在训练过程中提供支持，苹果与阿里均未回应。这与此前苹果在中国依赖本土第三方模型的策略不同。中国版Apple Intelligence仍将接入通义千问并使用百度技术，形成“自有模型+本土合作伙伴”双轨方案。苹果AI预计未来数月随iOS更新进入中国，其大中华区上季度收入同比增长约22%。","rel":"苹果在华为等本土品牌AI手机竞争压力下加速中国AI布局，并罕见引入中国供应商参与核心模型训练，凸显中国大模型与算力生态的全球竞争力提升。对宜兴的启示：其一，苹果“自有模型+本土伙伴”双轨策略说明合规与本地化是外资科技入华刚需，宜兴可关注AI算力、数据标注、合规服务等配套机会；其二，中国AI供应链向苹果这类顶级客户延伸，本地企业宜把握头部生态外溢，切入AI硬件配套与数据服务环节。","city":"库比蒂诺","src":"网易智能（路透社）","url":"https://www.163.com/tech/article/L4A5CCFS00097U7T.html"},{"co":"沙特阿美","ind":"石油/能源","type":"风险事件","date":"08-14","title":"胡塞武装无人机袭击沙特阿美吉赞炼油厂，中东能源供给风险升温","summary":"据胡塞武装控制的也门萨巴通讯社援引军方消息人士报道，胡塞武装两架无人机袭击了沙特阿美位于吉赞的炼油厂，称此次袭击是为报复沙特在萨达和哈杰对也门领空和主权的“侵犯”，并表示将继续对任何“侵犯”行为作出回击。事件叠加近期霍尔木兹海峡局势紧张，中东能源供给与航运安全风险进一步升温。","rel":"沙特阿美炼油设施遇袭叠加霍尔木兹海峡紧张，中东原油供给不确定性上升，可能推高国际油价，进而抬升化工、化纤、物流等行业的原材料与能源成本。宜兴化工及电缆等对石化原料依赖度较高的产业需关注油价波动对成本的传导，提前做好采购与库存对冲；同时，地缘冲突推动的能源安全诉求将强化光伏、储能等替代能源需求，为宜兴新能源与储能产业带来长期增量，宜关注储能出口与绿电配套机会。","city":"吉赞","src":"新浪财经（环球市场播报）","url":"https://finance.sina.com.cn/world/2026-08-14/doc-inineywf3246394.shtml"},{"co":"英伟达","ind":"半导体/AI算力","type":"技术路线","date":"08-14","title":"英伟达Feynman平台直上CPO与台积电A16，台积电SoIC产能上修至2027年底5万片","summary":"8月14日据DigiTimes报道，英伟达正将研发与供应链资源推向2028年下半年量产的Feynman世代，该平台预计直上台积电A16（2nm升级版）制程，并导入SoIC 3D堆叠与CPO共封装光学。受英伟达、AMD需求推动，台积电SoIC月产能规划由2026年底2万片大幅上修至2027年底5万片，嘉义AP7、南科AP8建设加速，厂务、设备进机持续抢进度，全球设备材料供应链有望迎新单。","rel":"英伟达下一代芯片向3D堆叠与共封装光学演进，牵动台积电先进制程与封装加速扩产，明确指向先进封装、CPO光器件、HBM等环节的确定性增量。对宜兴而言，先进封装对高密度互连基板、封装材料、散热方案的需求持续放大，宜兴在电子材料领域有基础，可跟踪台积电及国内封装厂扩产节奏，定向招引封装基板、导热材料、光器件相关配套企业；同时留意英伟达技术迭代加速对国产算力供应链的竞合压力。","city":"圣克拉拉","src":"新浪新闻（援引DigiTimes）","url":"https://www.sina.cn/weibo/detail/5331767105684128.html"}];

造基地一期投产，新一代智能滑板底盘i-SkateX5平台发布","rel":"尚元智行作为宜兴首家功能型无人车制造企业，无人车智造基地一期投产标志着宜兴在无人驾驶整车制造领域实现关键突破。对宜兴而言，尚元智行半年内完成签约落户、新品首发、批量投产，验证了宜兴人工智能产业集群的吸引力，其智能滑板底盘、无人车产线将带动本地精密制造、线束、传感器等配套需求，建议商务局将其作为AI+","src":"宜兴日报","url":"http://www.yixing.gov.cn/doc/2026/08/11/1410427.shtml"},{"cdate":"2026-08-11","co":"中际旭创","ind":"集成电路","t1":"市场反弹","title":"光模块利空解除中际旭创涨近3%，获中金、摩根大通密集增持","rel":"中际旭创获中外机构密集增持，验证AI光互联龙头全球竞争力。对宜兴而言，光模块产业链涉及PCB基板、高速连接器、精密加工等环节，宜兴集成电路材料企业处于AI算力硬件上游，可关注光模块供应链重构带来的配套机会。","src":"新浪财经","url":"https://finance.sina.com.cn/jjxw/2026-08-11/doc-inimxrnp4242140.shtml"},{"cdate":"2026-08-11","co":"新易盛","ind":"集成电路","t1":"市场反弹","title":"新易盛涨超4%领涨光模块，FCC限制传闻温和落地预期升温","rel":"新易盛领涨验证光模块板块基本面支撑稳固。对宜兴而言，AI算力需求爆发带动高速光模块产业链景气，宜兴精密制造、电子材料企业可关注光模块配套的硅光、高速PCB等环节供应机会。","src":"新浪财经","url":"https://finance.sina.com.cn/jjxw/2026-08-11/doc-inimxrnp4242140.shtml"},{"cdate":"2026-08-11","co":"天孚通信","ind":"集成电路","t1":"市场反弹","title":"天孚通信翻红涨0.6%，CPO配套FAU产品处订单交付阶段","rel":"天孚通信作为光器件龙头，CPO配套产品放量显示光互连技术迭代加速。对宜兴而言，光器件、高速连接器等环节的国产化替代空间大，宜兴精密制造企业可关注光互连产业链配套机会。","src":"新浪财经","url":"https://finance.sina.com.cn/jjxw/2026-08-11/doc-inimxrnp4242140.shtml"},{"cdate":"2026-08-11","co":"英伟达","ind":"集成电路","t1":"战略合作","title":"英伟达联手华尔街六大巨头，拟筹5000亿美元支持AI基础设施建设","rel":"英伟达作为全球AI芯片龙头，其推动AI基础设施金融化的举措将加速全球数据中心建设，宜兴电线电缆企业中已有远东股份等深度参与AI服务器用高速铜缆、光纤和储能配套，应把握AI基建扩张带来的高端线缆和储能订单机遇，引导本地线缆企业加快AIDC产品认证和市场导入。","src":"新浪财经","url":"https://finance.sina.com.cn/stock/bxjj/2026-08-11/doc-inimxmem0702836.shtml"},{"cdate":"2026-08-11","co":"英特尔","ind":"集成电路","t1":"资本市场","title":"英特尔宣布拟发行150亿美元普通股，重点投入先进封装和物理AI领域","rel":"英特尔大幅融资加速先进封装和AI芯片布局，全球半导体产能竞争进一步白热化。宜兴集成电路产业链中的雅克科技、中环领先等企业处于半导体材料和中游制造环节，应关注全球产能扩张带来的上游材料需求增长，尤其是先进封装所需的特种化学材料和硅片需求，推动本地半导体材料企业加快技术升级和产能储备。","src":"钛媒体","url":"https://www.tmtpost.com/fm/8098345.html"},{"cdate":"2026-08-11","co":"微软","ind":"通用人工智能","t1":"产品发布","title":"微软计划最快9月发布Maia 300 AI芯片，与台积电洽谈2027年交付逾30万枚","rel":"微软大规模自研AI芯片标志着云计算巨头从单纯采购GPU转向自研芯片，全球AI算力供给格局正在重塑。宜兴应关注AI芯片对高速互联和散热解决方案的需求爆发，远东股份在AIDC用光纤线缆、液冷产品方面 节能环保领域具备产业基础，AI数据中心的高能耗与散热需求也为本地环保装","src":"财联社","url":"https://www.cls.cn/detail/2449024"},{"cdate":"2026-08-08","co":"SK海力士","ind":"半导体/存储器","t1":"资产重组/战略评估","title":"SK海力士据悉评估重庆资产方案，或引入投资者估值约30亿美元","rel":"SK海力士评估重庆资产方案，是全球半导体供应链重构的重要信号。宜兴集成电路产业（中环领先、中车时代半导体、雅克科技等）应密切关注外资半导体企业在华产能调整动向，这既可能带来并购整合机会，也可能影响封装材料和设备的本地化配套需求。同时，重庆作为西部半导体重镇，其产业链调整对长三角半导体产业布局具有参考","src":"新浪财经","url":"https://finance.sina.com.cn/stock/bxjj/2026-08-08/doc-inimqimv9861262.shtml"},{"cdate":"2026-08-08","co":"英特尔","ind":"半导体/芯片","t1":"人事任命/管理层调整","title":"英特尔任命Dean Jarnac为执行副总裁兼首席销售官，首席营收官Greg Ernst将离职","rel":"英特尔高层销售团队换帅，反映全球半导体巨头正加速组织变革以应对AI时代竞争。宜兴集成电路产业企业可关注英特尔销售战略调整背后的产品重心变化——客户端计算与数据中心AI并重的布局信号。对于宜兴半导体材料和封装配套企业（中环领先、雅克科技等），英特尔新一代产品路线的演进方向直接影响上游材料需求结构；同时","src":"新浪财经","url":"https://finance.sina.com.cn/stock/bxjj/2026-08-08/doc-inimqccz6674796.shtml"},{"cdate":"2026-08-08","co":"寒武纪","ind":"集成电路","t1":"财报","title":"寒武纪上半年营收净利润均同比翻倍：营收59.96亿增长108%，净利23.11亿增长123%","rel":"寒武纪作为国产AI芯片龙头业绩爆发，对宜兴集成电路产业链具有重要信号意义。宜兴拥有中环领先、中科芯等半导体企业，寒武纪AI芯片规模化商用验证了国产替代路径可行性。可引导宜兴半导体企业加强与AI算力产业链对接，争取切入AI芯片封装测试、材料供应等配套环节，把握国产AI芯片扩产带来的供应链机遇与订单增长","src":"证券日报","url":"https://finance.sina.com.cn/jjxw/2026-08-08/doc-inimpnhc3019878.shtml"},{"cdate":"2026-08-08","co":"天合光能","ind":"新能源","t1":"财报","title":"天合光能半年报喊出行业两个'底'：政策底夯实、价格底确认，二季度业绩转正","rel":"天合光能作为光伏龙头首次明确释放行业见底信号，对宜兴光伏产业链具有风向标意义。宜兴拥有帝科股份（导电银浆）、中环领先（硅片）等光伏配套企业，行业底部确认意味着下游扩产与采购需求有望回暖。天合光能储能业务爆发式增长也提示宜兴新能源企业可关注光储融合方向，在储能配套、电力电子等环节寻找增量空间。","src":"华夏时报","url":"https://finance.eastmoney.com/a/202608083835818720.html"},{"cdate":"2026-08-08","co":"新易盛","ind":"集成电路","t1":"外资持仓","title":"华尔街明星公司推出光通信ETF近半仓位押注5家中国企业，新易盛位列第三大重仓股","rel":"华尔街资金用真金白银加仓中国光模块企业，印证了中国在光通信产业链的全球竞争力。宜兴在集成电路领域布局了中环领先、中科芯等企业，光模块产业链上游的光芯片、电芯片、封装基板等环节与宜兴半导体产业存在技术交叉和供应链协同空间。可关注光模块龙头企业的国产化配套需求，引导本地企业切入光通信供应链。","src":"每日经济新闻","url":"https://finance.eastmoney.com/a/202608083835818172.html"},{"cdate":"2026-08-08","co":"天孚通信","ind":"集成电路","t1":"外资持仓","title":"光通信ETF重仓中国光器件龙头，天孚通信等企业获华尔街资本密集配置","rel":"天孚通信作为光器件龙头获国际资本重仓，反映全球AI算力产业链对中国光通信企业的深度依赖。宜兴本地集成电路企业如中科芯、雅克科技等在封装基板、电子材料领域具备配套能力。光通信市场需求持续扩张带来的上游元器件需求增长，可为宜兴半导体材料及精密制造企业提供切入全球供应链的窗口和订单机会。","src":"每日经济新闻","url":"https://finance.eastmoney.com/a/202608083835818172.html"},{"cdate":"2026-08-08","co":"中际旭创","ind":"集成电路","t1":"政策风险","title":"美国拟禁中国光模块进口引行业震动，分析师称美国短期内不具备替代产能","rel":"美国光模块禁令若落地将冲击中国光通信出口，但也倒逼国产替代加速。宜兴集成电路产业可从中捕捉两类机会：一是禁令推动国内光芯片、电芯片自主化进程，宜兴半导体材料企业有望参与国产替代供应链；二是全球光模块供给紧张将推动产能向东南亚等地转移，宜兴可在招商引资中关注光通信企业海外产能配套的国内供应链需求。","src":"中新经纬","url":"https://finance.eastmoney.com/a/202608083835814158.html"},{"cdate":"2026-08-08","co":"理想汽车","ind":"新能源","t1":"组织变革","title":"理想汽车启动内部组织变革，研发前置应对行业同质化竞争","rel":"理想汽车的组织变革标志着新能源车企竞争已从配置堆料转向底层技术深耕。对宜兴而言，随着新能源整车企业强化自研能力，上游供应链企业需同步提升核心零部件研发水平，尤其是电控系统、智能驾驶算法等软硬一体化配套能力。宜兴可借此契机，引导本地新能源零部件企业向技术密集型转型，重点对接理想等车企新增的软件测试、调","src":"百姓评车（网易号）","url":"https://www.163.com/dy/article/L3Q396T8052791L8.html"},{"cdate":"2026-08-07","co":"中环领先","ind":"集成电路","t1":"环评获批","title":"中环领先半导体12寸外延片掺砷工艺研发项目环评获批","rel":"中环领先12寸掺砷外延片研发项目获批标志着宜兴集成电路产业向高端外延材料领域持续迈进。掺砷外延片是功率半导体核心材料，该项目契合国内功率器件国产替代趋势。建议宜兴商务局将此作为集成电路产业链招商亮点，重点关注项目后续设备采购、人才引进需求，并关注中环系在宜兴的持续扩产投资计划及上下游配套机会。","src":"宜兴经济技术开发区","url":"http://www.yixing.gov.cn/doc/2026/08/07/1410027.shtml"},{"cdate":"2026-08-07","co":"亨鑫科技","ind":"电线电缆","t1":"技术创新","title":"亨鑫科技射频研发团队工艺优化累计降本逾千万元","rel":"亨鑫科技通过工艺优化实现显著降本增效，体现了宜兴线缆企业向智能制造转型的实践成果。其射频同轴产品线工艺升级与设备智能化改造方向，与宜兴推动线缆产业高端化、智能化发展的战略方向高度一致。建议商务局跟踪亨鑫科技智能化产线改造进展，将其作为宜兴线缆产业数字化转型的示范案例进行推广。","src":"宜兴日报","url":"http://www.yixing.gov.cn/doc/2026/08/07/1410012.shtml"},{"cdate":"2026-08-07","co":"利通电子","ind":"高端装备","t1":"股价异动","title":"利通电子发布股票交易异常波动公告：连续3日涨幅偏离值累计达20%","rel":"利通电子股价连续三日异常波动，凸显市场对其AI算力转型的高度关注。公司作为宜兴高端装备领域上市企业，从传统液晶电视结构件向算力云服务延伸，已形成精密制造加算力双主业格局，半年度业绩预增显著。建议宜兴商务局关注利通电子算力业务快速放量对宜兴数字基础设施的带动作用，跟踪其精密金属结构件板块对本地高端装备","src":"中国证券报","url":"https://finance.sina.com.cn/jjxw/2026-08-07/doc-inimmtwv0156863.shtml"},{"cdate":"2026-08-07","co":"卓易信息","ind":"通用人工智能","t1":"融资融券","title":"卓易信息：8月6日获融资买入5765.07万元，融资余额4.41亿元","rel":"卓易信息作为宜兴唯一科创板上市软件企业，在信创固件及云计算领域具有稀缺性。融资余额占流通市值3.20%显示市场交投活跃，公司近期回购股份传递管理层信心。宜兴正积极布局通用人工智能产业，卓易信息可作为宜兴数字经济和信创产业的标杆，商务局可推动其与宜兴本地制造业企业的数字化转型合作，探索AI+制造业应用","src":"新浪证券-红岸工作室","url":"https://finance.sina.com.cn/stock/aiassist/lr/2026-08-07/doc-inimmyev3177004.shtml"},{"cdate":"2026-08-07","co":"帝科股份","ind":"新能源","t1":"券商研报","title":"东吴证券研报：帝科股份存储子公司持续受益存储涨价周期","rel":"帝科股份作为宜兴新能源材料上市企业，定增27.6亿元切入存储芯片封测赛道是宜兴企业从光伏向半导体跨界转型的标志性案例。其存储子公司受益全球存储涨价周期，有望打开第二增长曲线。宜兴商务局可将帝科股份作为传统产业跨界转型的示范案例，同时关注其存储封测基地建设对宜兴集成电路产业集群的补链作用，评估吸引封测","src":"界面新闻","url":"https://finance.sina.com.cn/jjxw/2026-08-07/doc-inimnkuf4173985.shtml"},{"cdate":"2026-08-07","co":"远东股份","ind":"电线电缆","t1":"融资融券","title":"远东股份：8月6日获融资买入1.56亿元，融资余额连续3天增加","rel":"远东股份是宜兴线缆产业龙头，主营智能缆网产品占营收85.71%。融资余额连续3日增加反映资本市场对其电能+算力+AI转型战略的认可，7月中标千万元以上合同订单达28.08亿元。融资融券双高揭示市场博弈情绪，宜兴商务局可持续关注其AIDC光纤产品、锂电铜箔等新业务进展及向特定对象发行股票审核进度，评估","src":"新浪证券-红岸工作室","url":"https://finance.sina.com.cn/stock/aiassist/lr/2026-08-07/doc-inimmyer3287027.shtml"},{"cdate":"2026-08-07","co":"远航精密","ind":"高端装备","t1":"融资融券","title":"远航精密：8月6日获融资买入156.49万元，融资余额连续3天增加","rel":"远航精密是宜兴在新能源材料领域的专精特新企业，镍基导体材料市占率超50%。融资余额连续3日增加反映市场对其固态电池集流体、氢能电极等新业务的关注。公司已投资宜锂科技（固态电池正极材料），形成镍基材料-固态电池产业链布局。宜兴商务局可推动远航精密与宜锂科技的产业协同，打造宜兴固态电池材料与装备产业集群","src":"新浪证券-红岸工作室","url":"https://finance.sina.com.cn/stock/aiassist/lr/2026-08-07/doc-inimmyer3303691.shtml"},{"cdate":"2026-08-07","co":"雅克科技","ind":"集成电路","t1":"融资融券","title":"雅克科技：8月6日获融资买入4.83亿元，融资余额27.62亿元占流通市值4.00%，超近一年90%分位","rel":"雅克科技是宜兴集成电路产业龙头上市企业，半导体前驱体材料为SK海力士、长鑫存储等头部芯片厂核心供应商。融资余额处于高位表明市场对其半导体材料业务景气预期强烈，同时融券余额高位暗含多空博弈。宜兴商务局可关注其半导体材料产能扩张及LNG板材订单进展，评估对宜兴集成电路材料产业集群的带动效应，推动上下游配","src":"新浪证券-红岸工作室","url":"https://finance.sina.com.cn/stock/aiassist/lr/2026-08-07/doc-inimmyer3341586.shtml"},{"cdate":"2026-08-07","co":"鹏鹞环保","ind":"节能环保","t1":"业务动态","title":"鹏鹞环保董秘回应装备业务发展与海外项目规划，子公司泉溪环保营收增长","rel":"鹏鹞环保作为宜兴节能环保领域上市龙头，SEED装配式水厂装备的国产化推广和海外出口具备较大市场空间。子公司泉溪环保装备业务营收增长显示宜兴环保装备制造细分领域发展势头良好，巴西市场调研也表明宜兴环保企业正积极探索一带一路沿线国家市场。建议宜兴商务局将鹏鹞环保作为环保装备出海标杆，关注其海外项目落地进","src":"新浪财经-问董秘","url":"https://finance.sina.com.cn/stock/relnews/dongmiqa/2026-08-07/doc-inimnrak9954764.shtml"},{"cdate":"2026-08-07","co":"中际旭创","ind":"集成电路","t1":"政策风险","title":"美拟禁中国光模块传闻震动市场，中际旭创回应称FCC未出台限制文件","rel":"美国对华光模块限制传闻持续发酵，反映出AI算力基础设施供应链地缘风险加剧。对宜兴而言，本地集成电路产业链应密切关注光模块国产替代窗口期机遇，尤其是光器件、光芯片等上游核心环节的自主化进程。宜兴的中环领先等半导体企业可关注高速光模块配套的硅光芯片、高速PCB等领域的供应链重构机会，积极争取头部光模块厂","src":"每日经济新闻","url":"https://news.sina.cn/gn/2026-08-07/detail-inimmiic3443760.d.html"},{"cdate":"2026-08-07","co":"大疆创新","ind":"低空经济","t1":"战略布局/商业模式","title":"800万架次之后：大疆的低空经济棋局渐入中盘，无人机机场覆盖全球500余城","rel":"大疆以地面机场基础设施切入低空经济的务实路径验证了'不飞不行'的刚性需求已经出现。对宜兴而言，低空基础设施的规模化部署需要大量地面装备支撑，涉及精密制造、充电设施、通信基站、传感器等产业链环节，宜兴线缆（远东股份、中超控股）和精密加工企业可关注无人机自动机场的配套需求。同时大疆生态已集成超1000个","src":"21世纪经济报道","url":"https://m.163.com/dy/article/L3ND1ETE05199NPP.html"},{"cdate":"2026-08-07","co":"天合光能","ind":"新能源","t1":"财报","title":"天合光能上半年营收319.85亿元亏损大幅收窄，储能业务贡献正向利润","rel":"天合光能储能业务快速成长为第二增长曲线，海外高价值市场占比近九成，验证光伏企业向光储一体化转型的战略价值。对宜兴而言，本地新能源产业链可积极关注光伏组件龙头的储能供应链外溢效应，特别是在储能电池、储能变流器、热管理系统等环节的配套机会。宜兴的远东电池等企业具备储能电池技术积累，可主动对接天合光能等龙","src":"每日经济新闻","url":"https://www.nbd.com.cn/articles/2026-08-07/4534625.html"},{"cdate":"2026-08-07","co":"恒瑞医药","ind":"生命健康","t1":"药品获批","title":"恒瑞医药瑞康曲妥珠单抗获批第三项适应症，成为中国首个结直肠癌抗HER2产品","rel":"恒瑞医药持续拓展创新药适应症版图，从非小细胞肺癌、乳腺癌到结直肠癌，ADC产品矩阵不断丰富，标志着中国药企在HER2靶向治疗领域从fast-follow向差异化创新迈进。对宜兴而言，本地生命健康企业应关注ADC等创新药赛道的产业配套需求，尤其是在生物制药原辅料、临床前研究服务、冷链物流等环节的配套机","src":"每日经济新闻","url":"https://www.nbd.com.cn/articles/2026-08-07/4534369.html"},{"cdate":"2026-08-07","co":"中复神鹰","ind":"新材料","t1":"融资计划","title":"中复神鹰拟定增募资不超38.93亿元用于高性能碳纤维项目","rel":"中复神鹰38.93亿定增加码高性能碳纤维，标志着国内碳纤维产业进入规模化扩张阶段。对宜兴启示：一是碳纤维下游应用（风电叶片、新能源汽车轻量化、氢能储氢瓶等）市场将快速扩大，宜兴本地高端装备和新能源企业可关注碳纤维复合材料替代机会；二是中国建材集团旗下企业加大新材料投入，宜兴可争取集团旗下其他新材料项","src":"上海证券报","url":"https://finance.sina.com.cn/stock/s/2026-08-07/doc-inimmtwt3398918.shtml"},{"cdate":"2026-08-07","co":"宁德时代","ind":"新能源/动力电池","t1":"行业排名","title":"上半年七家中国企业上榜全球动力电池装机量前十，合计份额72.4%创新高","rel":"中国动力电池产业全球主导地位进一步巩固，对宜兴新能源产业 var allData=DATA_LOCAL.concat(DATA_CHAIN).concat(DATA_G500).concat(DATA_TRACK);
var MODE='day',CUR_VIEW='local';
// 重点赛道分组配色（撞色，一眼分区）
var TRACK_COLORS=['#2563EB','#0E5E4E','#C8622D','#7C3AED','#0891B2','#B7791F','#DB2777','#059669','#DC2626','#4F46E5'];

const listEl=document.getElementById("list");
const cntEl=document.getElementById("cnt");
const chipN=document.getElementById("chipN");
const qEl=document.getElementById("q");
const fInd=document.getElementById("fInd");
const fType=document.getElementById("fType");
const fCity=document.getElementById("fCity");
const fCo=document.getElementById("fCo");

chipN.textContent=allData.length;

// Populate filters from all data + history
var allForFilter=allData.concat(HISTORY);
[...new Set(allForFilter.map(function(d){return d.ind}))].forEach(function(v){fInd.add(new Option(v,v))});
[...new Set(allForFilter.map(function(d){return d.t1||d.type}))].forEach(function(v){fType.add(new Option(v,v))});
[...new Set(allForFilter.map(function(d){return d.city||"宜兴"}))].forEach(function(v){fCity.add(new Option(v,v))});
[...new Set(allForFilter.map(function(d){return d.co}))].forEach(function(v){fCo.add(new Option(v,v))});

function switchMode(m){
  MODE=m;
  document.getElementById('tabDay').classList.toggle('on',m==='day');
  document.getElementById('tabHist').classList.toggle('on',m==='hist');
  document.getElementById('dayView').style.display=m==='day'?'block':'none';
  document.getElementById('histView').style.display=m==='hist'?'block':'none';
  if(m==='hist'){renderHist();}
  else{renderDay();}
  window.scrollTo({top:0,behavior:'smooth'});
}

function switchView(v){
  document.querySelectorAll('.view-tab').forEach(function(t){t.classList.toggle('on',t.dataset.v===v)});
  CUR_VIEW=v;
  renderDay();
  window.scrollTo({top:0,behavior:'smooth'});
}

function cardHTML(d,showTrack){
  return '<div class="card">'+
    '<div class="co-name">'+d.co+'</div>'+
    '<div class="top">'+
      '<span class="badge ind">'+(showTrack&&d.track?d.track:d.ind)+'</span>'+
      '<span class="badge type">'+d.type+'</span>'+
      '<span class="badge city">'+d.city+'</span>'+
      '<span class="badge date">'+d.date+'</span>'+
    '</div>'+
    '<div class="gist">'+d.title+'</div>'+
    '<div class="body-text">'+d.summary+'</div>'+
    '<div class="rel"><div class="lab">🔺 对宜启示</div><p>'+d.rel+'</p></div>'+
    '<div class="foot"><a class="srclink" href="'+d.url+'" target="_blank" rel="noopener">来源：'+d.src+'</a></div>'+
  '</div>';
}

function renderDay(){
  var htmlstr='';
  if(CUR_VIEW==='local'){
    var data=DATA_LOCAL;
    cntEl.textContent=data.length;
    htmlstr='<div class="grp tier2"><span>📍 本地重点企业动态</span><span class="gn">'+data.length+' 条</span></div>';
    htmlstr+=data.map(function(d){return cardHTML(d,false)}).join('');
  } else if(CUR_VIEW==='chain'){
    var data=DATA_CHAIN;
    cntEl.textContent=data.length;
    var tiers=[
      {k:'tier1',n:'🏛️ 传统优势支柱',d:'电线电缆 · 节能环保'},
      {k:'tier2',n:'🚀 战略新兴主导',d:'集成电路 · 新能源 · 生命健康 · 新材料'},
      {k:'tier3',n:'🌱 未来培育',d:'通用人工智能 · 高端装备'}
    ];
    tiers.forEach(function(tl){
      var tr=data.filter(function(d){return d.tier===tl.k});
      if(tr.length){
        htmlstr+='<div class="grp '+tl.k+'"><span>'+tl.n+'</span><span class="gn">'+tl.d+' · '+tr.length+' 条</span></div>';
        htmlstr+=tr.map(function(d){return cardHTML(d,false)}).join('');
      }
    });
  } else if(CUR_VIEW==='g500'){
    var data=DATA_G500;
    cntEl.textContent=data.length;
    htmlstr='<div class="grp tier2"><span>🏢 500强及央国企动态</span><span class="gn">'+data.length+' 条</span></div>';
    htmlstr+=data.map(function(d){return cardHTML(d,false)}).join('');
  } else if(CUR_VIEW==='track'){
    var data=DATA_TRACK;
    cntEl.textContent=data.length;
    var tracks=[];
    data.forEach(function(d){if(tracks.indexOf(d.track)<0)tracks.push(d.track)});
    tracks.forEach(function(tk,i){
      var tr=data.filter(function(d){return d.track===tk});
      var col=TRACK_COLORS[i%TRACK_COLORS.length];
      htmlstr+='<div class="grp track" style="background:'+col+';border-left-color:rgba(0,0,0,.22)"><span>🎯 '+tk+'</span><span class="gn">'+tr.length+' 条</span></div>';
      htmlstr+=tr.map(function(d){return cardHTML(d,true)}).join('');
    });
  }
  listEl.innerHTML=htmlstr||'<div class="empty">暂无动态</div>';
}

function renderHist(){
  var q=qEl?qEl.value.trim().toLowerCase():'';
  var i=fInd?fInd.value:'',t=fType?fType.value:'',c=fCity?fCity.value:'',co=fCo?fCo.value:'';
  var rows=HISTORY.filter(function(d){
    return(!i||d.ind===i)&&(!t||(d.t1||d.type)===t)&&(!c||(d.city||'宜兴')===c)&&(!co||d.co===co)&&(!q||(d.co+d.title+d.rel).toLowerCase().includes(q));
  });
  document.getElementById('histCnt').textContent=rows.length;
  var htmlstr='';
  // Group by date
  var dates=[];
  rows.forEach(function(d){if(dates.indexOf(d.cdate)<0)dates.push(d.cdate)});
  dates.forEach(function(dt){
    var dr=rows.filter(function(d){return d.cdate===dt});
    htmlstr+='<div class="grp hist"><span>📋 '+dt+'</span><span class="gn">'+dr.length+' 条</span></div>';
    htmlstr+=dr.map(function(d){
      return '<div class="hist-card">'+
        '<div class="hc-co">'+d.co+' <span style="font-size:11px;color:var(--sub);font-weight:400">'+d.ind+' · '+(d.t1||d.type)+'</span></div>'+
        '<div class="hc-title">'+d.title+'</div>'+
        '<div class="hc-rel">💡 '+d.rel+'</div>'+
        '<div class="hc-meta"><a href="'+d.url+'" target="_blank" style="color:var(--brand2)">来源：'+d.src+'</a></div>'+
      '</div>';
    }).join('');
  });
  document.getElementById('histList').innerHTML=htmlstr||'<div class="empty">没有匹配的历史动态</div>';
}

function render(){renderDay();}

// Search handlers
if(qEl)qEl.addEventListener('input',function(){if(MODE==='hist')renderHist()});
if(fInd)fInd.addEventListener('change',function(){if(MODE==='hist')renderHist()});
if(fType)fType.addEventListener('change',function(){if(MODE==='hist')renderHist()});
if(fCity)fCity.addEventListener('change',function(){if(MODE==='hist')renderHist()});
if(fCo)fCo.addEventListener('change',function(){if(MODE==='hist')renderHist()});

function reset(){
  if(qEl)qEl.value='';
  if(fInd)fInd.value='';
  if(fType)fType.value='';
  if(fCity)fCity.value='';
  if(fCo)fCo.value='';
  if(MODE==='hist')renderHist(); else renderDay();
}

function exportXLSX(){
  var data=MODE==='hist'?HISTORY:allData;
  var ws=XLSX.utils.json_to_sheet(data.map(function(d){
    return{日期:d.cdate||'2026-08-14',企业:d.co,产业:d.ind,分类:d.t1||d.type,标题:d.title,启示:d.rel,来源:d.src,链接:d.url};
  }));
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'宜兴企业动态');
  XLSX.writeFile(wb,'宜兴企业动态_'+(MODE==='hist'?'历史':'当日')+'_20260814.xlsx');
}

render();

</script>
