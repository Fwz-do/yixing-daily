<script>
(function(){
  var PW="123456", KEY="yx_daily_0730_ok";
  var gate=document.getElementById('pass-gate'),inp=document.getElementById('pass-input'),
      err=document.getElementById('pass-err'),btn=document.getElementById('pass-btn');
  function unlock(){gate.parentNode.removeChild(gate);document.body.style.overflow='';}
  function tryPw(){if(inp.value===PW){try{sessionStorage.setItem(KEY,'1')}catch(e){}unlock();}else{err.style.display='block';inp.value='';inp.focus();}}
  try{if(sessionStorage.getItem(KEY)==='1'){unlock();return;}}catch(e){}
  document.body.style.overflow='hidden';
  btn.addEventListener('click',tryPw);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});
  setTimeout(function(){inp.focus();},300);
})();
</script>

s://finance.eastmoney.com/a/202608083835814158.html"},{"cdate":"2026-08-08","co":"理想汽车","ind":"新能源","t1":"组织变革","title":"理想汽车启动内部组织变革，研发前置应对行业同质化竞争","rel":"理想汽车的组织变革标志着新能源车企竞争已从配置堆料转向底层技术深耕。对宜兴而言，随着新能源整车企业强化自研能力，上游供应链企业需同步提升核心零部件研发水平，尤其是电控系统、智能驾驶算法等软硬一体化配套能力。宜兴可借此契机，引导本地新能源零部件企业向技术密集型转型，重点对接理想等车企新增的软件测试、调","src":"百姓评车（网易号）","url":"https://www.163.com/dy/article/L3Q396T8052791L8.html"},{"cdate":"2026-08-07","co":"中环领先","ind":"集成电路","t1":"环评获批","title":"中环领先半导体12寸外延片掺砷工艺研发项目环评获批","rel":"中环领先12寸掺砷外延片研发项目获批标志着宜兴集成电路产业向高端外延材料领域持续迈进。掺砷外延片是功率半导体核心材料，该项目契合国内功率器件国产替代趋势。建议宜兴商务局将此作为集成电路产业链招商亮点，重点关注项目后续设备采购、人才引进需求，并关注中环系在宜兴的持续扩产投资计划及上下游配套机会。","src":"宜兴经济技术开发区","url":"http://www.yixing.gov.cn/doc/2026/08/07/1410027.shtml"},{"cdate":"2026-08-07","co":"亨鑫科技","ind":"电线电缆","t1":"技术创新","title":"亨鑫科技射频研发团队工艺优化累计降本逾千万元","rel":"亨鑫科技通过工艺优化实现显著降本增效，体现了宜兴线缆企业向智能制造转型的实践成果。其射频同轴产品线工艺升级与设备智能化改造方向，与宜兴推动线缆产业高端化、智能化发展的战略方向高度一致。建议商务局跟踪亨鑫科技智能化产线改造进展，将其作为宜兴线缆产业数字化转型的示范案例进行推广。","src":"宜兴日报","url":"http://www.yixing.gov.cn/doc/2026/08/07/1410012.shtml"},{"cdate":"2026-08-07","co":"利通电子","ind":"高端装备","t1":"股价异动","title":"利通电子发布股票交易异常波动公告：连续3日涨幅偏离值累计达20%","rel":"利通电子股价连续三日异常波动，凸显市场对其AI算力转型的高度关注。公司作为宜兴高端装备领域上市企业，从传统液晶电视结构件向算力云服务延伸，已形成精密制造加算力双主业格局，半年度业绩预增显著。建议宜兴商务局关注利通电子算力业务快速放量对宜兴数字基础设施的带动作用，跟踪其精密金属结构件板块对本地高端装备","src":"中国证券报","url":"https://finance.sina.com.cn/jjxw/2026-08-07/doc-inimmtwv0156863.shtml"},{"cdate":"2026-08-07","co":"卓易信息","ind":"通用人工智能","t1":"融资融券","title":"卓易信息：8月6日获融资买入5765.07万元，融资余额4.41亿元","rel":"卓易信息作为宜兴唯一科创板上市软件企业，在信创固件及云计算领域具有稀缺性。融资余额占流通市值3.20%显示市场交投活跃，公司近期回购股份传递管理层信心。宜兴正积极布局通用人工智能产业，卓易信息可作为宜兴数字经济和信创产业的标杆，商务局可推动其与宜兴本地制造业企业的数字化转型合作，探索AI+制造业应用","src":"新浪证券-红岸工作室","url":"https://finance.sina.com.cn/stock/aiassist/lr/2026-08-07/doc-inimmyev3177004.shtml"},{"cdate":"2026-08-07","co":"帝科股份","ind":"新能源","t1":"券商研报","title":"东吴证券研报：帝科股份存储子公司持续受益存储涨价周期","rel":"帝科股份作为宜兴新能源材料上市企业，定增27.6亿元切入存储芯片封测赛道是宜兴企业从光伏向半导体跨界转型的标志性案例。其存储子公司受益全球存储涨价周期，有望打开第二增长曲线。宜兴商务局可将帝科股份作为传统产业跨界转型的示范案例，同时关注其存储封测基地建设对宜兴集成电路产业集群的补链作用，评估吸引封测","src":"界面新闻","url":"https://finance.sina.com.cn/jjxw/2026-08-07/doc-inimnkuf4173985.shtml"},{"cdate":"2026-08-07","co":"远东股份","ind":"电线电缆","t1":"融资融券","title":"远东股份：8月6日获融资买入1.56亿元，融资余额连续3天增加","rel":"远东股份是宜兴线缆产业龙头，主营智能缆网产品占营收85.71%。融资余额连续3日增加反映资本市场对其电能+算力+AI转型战略的认可，7月中标千万元以上合同订单达28.08亿元。融资融券双高揭示市场博弈情绪，宜兴商务局可持续关注其AIDC光纤产品、锂电铜箔等新业务进展及向特定对象发行股票审核进度，评估","src":"新浪证券-红岸工作室","url":"https://finance.sina.com.cn/stock/aiassist/lr/2026-08-07/doc-inimmyer3287027.shtml"},{"cdate":"2026-08-07","co":"远航精密","ind":"高端装备","t1":"融资融券","title":"远航精密：8月6日获融资买入156.49万元，融资余额连续3天增加","rel":"远航精密是宜兴在新能源材料领域的专精特新企业，镍基导体材料市占率超50%。融资余额连续3日增加反映市场对其固态电池集流体、氢能电极等新业务的关注。公司已投资宜锂科技（固态电池正极材料），形成镍基材料-固态电池产业链布局。宜兴商务局可推动远航精密与宜锂科技的产业协同，打造宜兴固态电池材料与装备产业集群","src":"新浪证券-红岸工作室","url":"https://finance.sina.com.cn/stock/aiassist/lr/2026-08-07/doc-inimmyer3303691.shtml"},{"cdate":"2026-08-07","co":"雅克科技","ind":"集成电路","t1":"融资融券","title":"雅克科技：8月6日获融资买入4.83亿元，融资余额27.62亿元占流通市值4.00%，超近一年90%分位","rel":"雅克科技是宜兴集成电路产业龙头上市企业，半导体前驱体材料为SK海力士、长鑫存储等头部芯片厂核心供应商。融资余额处于高位表明市场对其半导体材料业务景气预期强烈，同时融券余额高位暗含多空博弈。宜兴商务局可关注其半导体材料产能扩张及LNG板材订单进展，评估对宜兴集成电路材料产业集群的带动效应，推动上下游配","src":"新浪证券-红岸工作室","url":"https://finance.sina.com.cn/stock/aiassist/lr/2026-08-07/doc-inimmyer3341586.shtml"},{"cdate":"2026-08-07","co":"鹏鹞环保","ind":"节能环保","t1":"业务动态","title":"鹏鹞环保董秘回应装备业务发展与海外项目规划，子公司泉溪环保营收增长","rel":"鹏鹞环保作为宜兴节能环保领域上市龙头，SEED装配式水厂装备的国产化推广和海外出口具备较大市场空间。子公司泉溪环保装备业务营收增长显示宜兴环保装备制造细分领域发展势头良好，巴西市场调研也表明宜兴环保企业正积极探索一带一路沿线国家市场。建议宜兴商务局将鹏鹞环保作为环保装备出海标杆，关注其海外项目落地进","src":"新浪财经-问董秘","url":"https://finance.sina.com.cn/stock/relnews/dongmiqa/2026-08-07/doc-inimnrak9954764.shtml"},{"cdate":"2026-08-07","co":"中际旭创","ind":"集成电路","t1":"政策风险","title":"美拟禁中国光模块传闻震动市场，中际旭创回应称FCC未出台限制文件","rel":"美国对华光模块限制传闻持续发酵，反映出AI算力基础设施供应链地缘风险加剧。对宜兴而言，本地集成电路产业链应密切关注光模块国产替代窗口期机遇，尤其是光器件、光芯片等上游核心环节的自主化进程。宜兴的中环领先等半导体企业可关注高速光模块配套的硅光芯片、高速PCB等领域的供应链重构机会，积极争取头部光模块厂","src":"每日经济新闻","url":"https://news.sina.cn/gn/2026-08-07/detail-inimmiic3443760.d.html"},{"cdate":"2026-08-07","co":"大疆创新","ind":"低空经济","t1":"战略布局/商业模式","title":"800万架次之后：大疆的低空经济棋局渐入中盘，无人机机场覆盖全球500余城","rel":"大疆以地面机场基础设施切入低空经济的务实路径验证了'不飞不行'的刚性需求已经出现。对宜兴而言，低空基础设施的规模化部署需要大量地面装备支撑，涉及精密制造、充电设施、通信基站、传感器等产业链环节，宜兴线缆（远东股份、中超控股）和精密加工企业可关注无人机自动机场的配套需求。同时大疆生态已集成超1000个","src":"21世纪经济报道","url":"https://m.163.com/dy/article/L3ND1ETE05199NPP.html"},{"cdate":"2026-08-07","co":"天合光能","ind":"新能源","t1":"财报","title":"天合光能上半年营收319.85亿元亏损大幅收窄，储能业务贡献正向利润","rel":"天合光能储能业务快速成长为第二增长曲线，海外高价值市场占比近九成，验证光伏企业向光储一体化转型的战略价值。对宜兴而言，本地新能源产业链可积极关注光伏组件龙头的储能供应链外溢效应，特别是在储能电池、储能变流器、热管理系统等环节的配套机会。宜兴的远东电池等企业具备储能电池技术积累，可主动对接天合光能等龙","src":"每日经济新闻","url":"https://www.nbd.com.cn/articles/2026-08-07/4534625.html"},{"cdate":"2026-08-07","co":"恒瑞医药","ind":"生命健康","t1":"药品获批","title":"恒瑞医药瑞康曲妥珠单抗获批第三项适应症，成为中国首个结直肠癌抗HER2产品","rel":"恒瑞医药持续拓展创新药适应症版图，从非小细胞肺癌、乳腺癌到结直肠癌，ADC产品矩阵不断丰富，标志着中国药企在HER2靶向治疗领域从fast-follow向差异化创新迈进。对宜兴而言，本地生命健康企业应关注ADC等创新药赛道的产业配套需求，尤其是在生物制药原辅料、临床前研究服务、冷链物流等环节的配套机","src":"每日经济新闻","url":"https://www.nbd.com.cn/articles/2026-08-07/4534369.html"},{"cdate":"2026-08-07","co":"中复神鹰","ind":"新材料","t1":"融资计划","title":"中复神鹰拟定增募资不超38.93亿元用于高性能碳纤维项目","rel":"中复神鹰38.93亿定增加码高性能碳纤维，标志着国内碳纤维产业进入规模化扩张阶段。对宜兴启示：一是碳纤维下游应用（风电叶片、新能源汽车轻量化、氢能储氢瓶等）市场将快速扩大，宜兴本地高端装备和新能源企业可关注碳纤维复合材料替代机会；二是中国建材集团旗下企业加大新材料投入，宜兴可争取集团旗下其他新材料项","src":"上海证券报","url":"https://finance.sina.com.cn/stock/s/2026-08-07/doc-inimmtwt3398918.shtml"},{"cdate":"2026-08-07","co":"宁德时代","ind":"新能源/动力电池","t1":"行业排名","title":"上半年七家中国企业上榜全球动力电池装机量前十，合计份额72.4%创新高","rel":"中国动力电池产业全球主导地位进一步巩固，对宜兴新能源产业具有直接带动效应。宜兴远东电池作为锂电池企业可受益于行业整体高景气度带来的市场拓展机遇。宜兴帝科股份等光伏导电银浆企业可关注动力电池材料国产化替代带来的跨界需求，特别是电池导电剂和新型集流体等细分领域。建议宜兴商务局依托本地新能源产业基础，积极","src":"每日经济新闻","url":"https://www.163.com/dy/article/L3NAO9EH0512B07B.html"},{"cdate":"2026-08-07","co":"施耐德电气","ind":"电力装备","t1":"绿色制造","title":"施耐德电气北京园区获评世界经济论坛'可持续灯塔工厂'，AI驱动全链条减碳","rel":"施耐德电气北京园区的绿色制造实践为宜兴制造业企业提供了可复制的转型路径参考。宜兴在电线电缆、节能环保、陶瓷耐材等领域聚集了大量制造企业，面临同样的减碳压力和绿色贸易壁垒。园区将AI嵌入全链条的做法——从设计替代高GWP材料（如六氟化硫）、供应商碳管理数字化、到工艺参数AI优化——为宜兴企业提供了渐进","src":"21世纪经济报道","url":"https: var TRACK_COLORS=['#2563EB','#0E5E4E','#C8622D','#7C3AED','#0891B2','#B7791F','#DB2777','#059669','#DC2626','#4F46E5'];

const listEl=document.getElementById("list");
const cntEl=document.getElementById("cnt");
const chipN=document.getElementById("chipN");
const qEl=document.getElementById("q");
const fInd=document.getElementById("fInd");
const fType=document.getElementById("fType");
const fCity=document.getElementById("fCity");
const fCo=document.getElementById("fCo");

chipN.textContent=allData.length;

// Populate filters from all data + history
var allForFilter=allData.concat(HISTORY);
[...new Set(allForFilter.map(function(d){return d.ind}))].forEach(function(v){fInd.add(new Option(v,v))});
[...new Set(allForFilter.map(function(d){return d.t1||d.type}))].forEach(function(v){fType.add(new Option(v,v))});
[...new Set(allForFilter.map(function(d){return d.city||"宜兴"}))].forEach(function(v){fCity.add(new Option(v,v))});
[...new Set(allForFilter.map(function(d){return d.co}))].forEach(function(v){fCo.add(new Option(v,v))});

function switchMode(m){
  MODE=m;
  document.getElementById('tabDay').classList.toggle('on',m==='day');
  document.getElementById('tabHist').classList.toggle('on',m==='hist');
  document.getElementById('dayView').style.display=m==='day'?'block':'none';
  document.getElementById('histView').style.display=m==='hist'?'block':'none';
  if(m==='hist'){renderHist();}
  else{renderDay();}
  window.scrollTo({top:0,behavior:'smooth'});
}

function switchView(v){
  document.querySelectorAll('.view-tab').forEach(function(t){t.classList.toggle('on',t.dataset.v===v)});
  CUR_VIEW=v;
  renderDay();
  window.scrollTo({top:0,behavior:'smooth'});
}

function cardHTML(d,showTrack){
  return '<div class="card">'+
    '<div class="co-name">'+d.co+'</div>'+
    '<div class="top">'+
      '<span class="badge ind">'+(showTrack&&d.track?d.track:d.ind)+'</span>'+
      '<span class="badge type">'+d.type+'</span>'+
      '<span class="badge city">'+d.city+'</span>'+
      '<span class="badge date">'+d.date+'</span>'+
    '</div>'+
    '<div class="gist">'+d.title+'</div>'+
    '<div class="body-text">'+d.summary+'</div>'+
    '<div class="rel"><div class="lab">🔺 对宜启示</div><p>'+d.rel+'</p></div>'+
    '<div class="foot"><a class="srclink" href="'+d.url+'" target="_blank" rel="noopener">来源：'+d.src+'</a></div>'+
  '</div>';
}

function renderDay(){
  var htmlstr='';
  if(CUR_VIEW==='local'){
    var data=DATA_LOCAL;
    cntEl.textContent=data.length;
    htmlstr='<div class="grp tier2"><span>📍 本地重点企业动态</span><span class="gn">'+data.length+' 条</span></div>';
    htmlstr+=data.map(function(d){return cardHTML(d,false)}).join('');
  } else if(CUR_VIEW==='chain'){
    var data=DATA_CHAIN;
    cntEl.textContent=data.length;
    var tiers=[
      {k:'tier1',n:'🏛️ 传统优势支柱',d:'电线电缆 · 节能环保'},
      {k:'tier2',n:'🚀 战略新兴主导',d:'集成电路 · 新能源 · 生命健康 · 新材料'},
      {k:'tier3',n:'🌱 未来培育',d:'通用人工智能 · 高端装备'}
    ];
    tiers.forEach(function(tl){
      var tr=data.filter(function(d){return d.tier===tl.k});
      if(tr.length){
        htmlstr+='<div class="grp '+tl.k+'"><span>'+tl.n+'</span><span class="gn">'+tl.d+' · '+tr.length+' 条</span></div>';
        htmlstr+=tr.map(function(d){return cardHTML(d,false)}).join('');
      }
    });
  } else if(CUR_VIEW==='g500'){
    var data=DATA_G500;
    cntEl.textContent=data.length;
    htmlstr='<div class="grp tier2"><span>🏢 500强及央国企动态</span><span class="gn">'+data.length+' 条</span></div>';
    htmlstr+=data.map(function(d){return cardHTML(d,false)}).join('');
  } else if(CUR_VIEW==='track'){
    var data=DATA_TRACK;
    cntEl.textContent=data.length;
    var tracks=[];
    data.forEach(function(d){if(tracks.indexOf(d.track)<0)tracks.push(d.track)});
    tracks.forEach(function(tk,i){
      var tr=data.filter(function(d){return d.track===tk});
      var col=TRACK_COLORS[i%TRACK_COLORS.length];
      htmlstr+='<div class="grp track" style="background:'+col+';border-left-color:rgba(0,0,0,.22)"><span>🎯 '+tk+'</span><span class="gn">'+tr.length+' 条</span></div>';
      htmlstr+=tr.map(function(d){return cardHTML(d,true)}).join('');
    });
  }
  listEl.innerHTML=htmlstr||'<div class="empty">暂无动态</div>';
}

function renderHist(){
  var q=qEl?qEl.value.trim().toLowerCase():'';
  var i=fInd?fInd.value:'',t=fType?fType.value:'',c=fCity?fCity.value:'',co=fCo?fCo.value:'';
  var rows=HISTORY.filter(function(d){
    return(!i||d.ind===i)&&(!t||(d.t1||d.type)===t)&&(!c||(d.city||'宜兴')===c)&&(!co||d.co===co)&&(!q||(d.co+d.title+d.rel).toLowerCase().includes(q));
  });
  document.getElementById('histCnt').textContent=rows.length;
  var htmlstr='';
  // Group by date
  var dates=[];
  rows.forEach(function(d){if(dates.indexOf(d.cdate)<0)dates.push(d.cdate)});
  dates.forEach(function(dt){
    var dr=rows.filter(function(d){return d.cdate===dt});
    htmlstr+='<div class="grp hist"><span>📋 '+dt+'</span><span class="gn">'+dr.length+' 条</span></div>';
    htmlstr+=dr.map(function(d){
      return '<div class="hist-card">'+
        '<div class="hc-co">'+d.co+' <span style="font-size:11px;color:var(--sub);font-weight:400">'+d.ind+' · '+(d.t1||d.type)+'</span></div>'+
        '<div class="hc-title">'+d.title+'</div>'+
        '<div class="hc-rel">💡 '+d.rel+'</div>'+
        '<div class="hc-meta"><a href="'+d.url+'" target="_blank" style="color:var(--brand2)">来源：'+d.src+'</a></div>'+
      '</div>';
    }).join('');
  });
  document.getElementById('histList').innerHTML=htmlstr||'<div class="empty">没有匹配的历史动态</div>';
}

function render(){renderDay();}

// Search handlers
if(qEl)qEl.addEventListener('input',function(){if(MODE==='hist')renderHist()});
if(fInd)fInd.addEventListener('change',function(){if(MODE==='hist')renderHist()});
if(fType)fType.addEventListener('change',function(){if(MODE==='hist')renderHist()});
if(fCity)fCity.addEventListener('change',function(){if(MODE==='hist')renderHist()});
if(fCo)fCo.addEventListener('change',function(){if(MODE==='hist')renderHist()});

function reset(){
  if(qEl)qEl.value='';
  if(fInd)fInd.value='';
  if(fType)fType.value='';
  if(fCity)fCity.value='';
  if(fCo)fCo.value='';
  if(MODE==='hist')renderHist(); else renderDay();
}

function exportXLSX(){
  var data=MODE==='hist'?HISTORY:allData;
  var ws=XLSX.utils.json_to_sheet(data.map(function(d){
    return{日期:d.cdate||'2026-08-18',企业:d.co,产业:d.ind,分类:d.t1||d.type,标题:d.title,启示:d.rel,来源:d.src,链接:d.url};
  }));
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'宜兴企业动态');
  XLSX.writeFile(wb,'宜兴企业动态_'+(MODE==='hist'?'历史':'当日')+'_20260818.xlsx');
}

render();

</script>
</body>
</html>
