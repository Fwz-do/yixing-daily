<script>
(function(){
  var PW="123456", KEY="yx_daily_0801_ok";
  var gate=document.getElementById('pass-gate'),inp=document.getElementById('pass-input'),
      err=document.getElementById('pass-err'),btn=document.getElementById('pass-btn');
  function unlock(){gate.parentNode.removeChild(gate);document.body.style.overflow='';}
  function tryPw(){if(inp.value===PW){try{sessionStorage.setItem(KEY,'1')}catch(e){}unlock();}else{err.style.display='block';inp.value='';inp.focus();}}
  try{if(sessionStorage.getItem(KEY)==='1'){unlock();return;}}catch(e){}
  document.body.style.overflow='hidden';
  btn.addEventListener('click',tryPw);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});
  setTimeout(function(){inp.focus();},300);
})();
</script>

 summary:"中晟高科7月15日发布半年度业绩预告，预计2026上半年归母净利润亏损1000万-1300万元，同比由盈转亏。与此同时，公司转型储能第二增长曲线的动作在持续：位于宜兴新建镇的60MW/120MWh储能电站项目按计划推进建设，年初已控股无锡普睿能源切入储能业务。传统润滑油/环保主业承压，是其向储能+新材料多轮驱动转型的直接动因。",
 rel:"中晟高科的短期预亏与储能转型并存，折射宜兴中型环保企业寻找第二曲线的普遍焦虑与努力。传统环保工程与润滑油业务天花板已现、利润承压，倒逼企业向储能等高景气赛道延伸。60MW/120MWh电站是其从卖设备/工程向持有运营储能资产模式探索的关键一步。对宜兴而言，这类企业的转型阵痛期需关注——短期业绩波动是必然代价，能否成功切换赛道决定其中长期价值。",

{co:"立霸股份",ind:"高端装备",type:"股价异动",date:"07-23",
 title:"立霸股份连续异动累计跌超20%，公司澄清主营正常、5%以上股东完成协议转让",
 summary:"立霸股份7月20日、22日、23日连续发布股票交易异常波动公告，收盘价跌幅偏离值累计超20%。公司澄清家电用复合材料主业生产经营正常，订单、原材料、产销规模无重大变化，无业务转型等重大事项，上半年经营业绩测算未触及业绩预告披露标准。此前7月2日，持股5%以上股东通过公开征集转让方式完成股份协议转让。Q1营收3.95亿元、归母净利3381万元。",
 rel:"立霸股份的股价异动更多是市场情绪波动而非基本面变化，公司及时澄清体现了规范的信息披露。对宜兴而言，立霸是本地复合材料领域的上市企业，其高端装备+新材料的交叉定位有向数据中心、新能源等新场景延伸的潜力，但当前主业仍以家电复合材料为主、增长平稳。这也提示本地传统制造上市公司：唯有真正切入高景气赛道、拿到实质订单，才能获得可持续的价值重估。",

{co:"鸿羽航空",ind:"高端装备",type:"项目投产",date:"07-27",
 title:"航空复材项目8月底宜兴投产——鸿羽航空联手匈牙利团队，首款飞机机身明年出口美国",
 summary:"据无锡市政府7月27日报道，鸿羽航空科技（无锡）有限公司在宜兴丁蜀通航产业园投资建设的航空复合材料生产制造项目，将于8月底正式投产。项目技术带头人、匈牙利航空复材公司董事长安德拉什专程来宜为投产做准备。项目首批试生产产品将于10月下线，预计明年首款研发制造的飞机机身将出口美国。该项目不仅填补了宜兴低空经济产业链高端材料核心短板，还实现了产业链本地配套——由宜兴本地企业提供重要原材料。",
 rel:"鸿羽航空项目是宜兴低空经济产业集群的标志性突破。依托丁蜀通航产业园，宜兴正从通用航空基础设施向高端航空制造核心环节延伸。航空复材（碳纤维复合材料）是飞机制造的轻量化骨骼，技术壁垒极高，匈牙利团队的技术引进打通了中欧航空产业技术通道。更值得关注的是本地原材料配套的实现——这意味着宜兴已初步形成从原材料到复材制造再到机身出口的航空产业链雏形，是宜兴从传统制造向高端航空制造转型的重要里程碑。",
 city:"宜兴",src:"无锡市政府网",url:"https://cc.wuxi.gov.cn/doc/2026/07/27/4810158.shtml"},
{co:"远航精密",ind:"高端装备",type:"股东增持",date:"07-29",
 title:"远航精密控股股东首次增持5.62万股，耗资101万，计划半年内增持不超过4500万",
 summary:"远航精密7月29日公告，控股股东远航时代于7月28日通过集中竞价首次增持公司股份5.62万股，增持金额101.34万元，增持后持股比例升至39.7324%。本次增持计划实施期间为公告日起6个月内，计划增持金额不超过4500万元，资金来源为自有资金与专项贷款结合。公司主营电池精密镍基导体材料，2025年营收10.43亿元同比增长22.38%。",
 rel:"远航精密控股股东启动增持，凸显对公司长期价值的信心。公司主营镍基导体材料是锂电池、固态电池的关键组件，下游绑定新能源产业。尤其值得关注的是远航精密参与宜锂科技A轮融资——镍基材料+固态正极的本地产业链协同正在加速形成。对宜兴而言，远航精密+宜锂科技构成固态电池装备材料的小集群，在固态电池产业爆发前夜提前卡位，具有战略性产业布局价值。",

{co:"银轮股份",ind:"高端装备",type:"送样/订单",date:"07-26",
 title:"银轮股份数据中心液冷零部件送样获小批订单，2026年液冷产业化关键之年",

 city:"宜兴",src:"证券时报",url:"https://www.stcn.com/article/detail/4041494.html"},
{co:"中辰股份",ind:"电线电缆",type:"中标",date:"07-30",

 city:"宜兴",src:"证券时报",url:"https://www.stcn.com/article/detail/4037549.html"},
{co:"鹏鹞环保",ind:"节能环保",type:"业务进展",date:"07-30",
 title:"鹏鹞环保业务承订额超7.8亿，SEED低碳水厂已落地缅甸，环保产业持续全国布局",
 summary:"鹏鹞环保作为中国环保之乡宜兴的龙头环保上市企业，上半年业务承订额已超7.8亿元，涵盖污水处理、水环境综合治理、环卫一体化等领域。公司自主研发的SEED低碳装备化水厂已成功落地缅甸等海外市场，运营成本较传统水厂降低约30%，成为宜兴环保装备出海的典型案例。鹏鹞为宜兴环科园入驻的创业板上市公司。",
 rel:"鹏鹞环保7.8亿业务承订额和SEED水厂出海，展示了宜兴环保产业的全国竞争力与国际化能力。宜兴环科园是中国唯一的国家级环保科技工业园区，聚集了数百家环保企业，鹏鹞是其中的装备化、智能化转型标杆。SEED低碳水厂降低30%运营成本的突破，意味着宜兴环保装备已从工程承包向产品化、标准化、可复制的装备出口升级——这对宜兴环保产业集群的整体升级具有示范意义。",
 city:"宜兴",src:"东方财富",url:"https://finance.eastmoney.com/a/202605203743216739.html"}

 summary:"港股AI制药第一股英矽智能7月9日发布2026年中期盈利预喜：上半年收入约1.025亿-1.065亿美元，同比增272.7%-287.3%；净利润3350万-3950万美元，成功扭亏。2026年上半年落地4笔大额BD合作（施维雅8.88亿、礼来27.5亿、SK 25亿、武田6亿美元），潜在总额近70亿美元。核心管线Rentosertib（AI原创IPF药物）正式启动Ⅲ期临床。公司已落户宜兴陶都科技新城。",
 rel:"英矽智能扭亏+70亿美元BD，标志着AI制药从概念验证进入商业化兑现阶段。作为港股AI制药第一股，英矽半年拿下四家全球顶级药企合作，其Pharma.AI平台已在全球Top 20药企中覆盖13家。对宜兴而言，英矽智能落户陶都科技新城的战略价值远不止一家上市公司——它是宜兴生命健康产业对标全球前沿科技的旗帜，AI制药能力的本地化将带动宜兴药谷在创新药发现环节建立差异化竞争力，吸引更多上下游企业集聚。",

{co:"亨鑫科技",ind:"电线电缆",tier:"tier1",type:"中标",date:"07-21",
 title:"亨鑫科技子公司中标2026青海太阳能热发电项目——通信线缆企业延伸新能源工程",
 summary:"港股上市的宜兴通信线缆企业亨鑫科技（01082.HK）7月21日公告，子公司在2026年青海太阳能热发电项目中成功中标。亨鑫主营射频电缆、通信线缆，此次切入光热发电项目，是从通信基础设施向新能源工程领域的延伸。青海是国内光热发电示范基地集中地，光热因可配置储热、出力稳定，被视为新型电力系统的重要调峰电源。",
 rel:"亨鑫科技中标青海光热项目，展示了宜兴线缆企业向新能源工程跨界的又一路径。与远东（AIDC光纤）、中超（航空航天）的转型方向不同，亨鑫选择依托通信线缆的工程能力切入光热发电这一细分新能源赛道。对宜兴而言，这再次印证本地线缆产业集群并未固守传统市场，而是各自寻找差异化的高景气出口——有的向AI基建，有的向航空航天，有的向新能源工程。这种一业多元、各展所长的转型生态，正是宜兴传统优势产业保持增长动能的底层逻辑。",

{co:"中国稀土控股",ind:"集成电路",tier:"tier2",type:"行业景气",date:"07-29",
 title:"稀土价格高位运行，氧化镨钕同比涨71.7%；中国稀土控股仍停牌、推进复牌",
 summary:"2026年稀土价格持续高企，中国稀土行业协会稀土价格指数7月末维持在268-270高位，氧化镨钕均价约73.99万元/吨、较2025年上半年同期上涨71.7%，主因供给端指标增速放缓（首批同比仅增5.2%）叠加新能源车、机器人需求快增（上半年新能源车产量超700万辆、工业机器人产量同比增47.8%）。宜兴关联的中国稀土控股（00769.HK）自2025年6月18日起停牌，7月9日迁址并披露复牌进展。",

{co:"远程股份",ind:"电线电缆",tier:"tier1",type:"业绩预警",date:"07-15",

 summary:"远程股份7月15日发布半年度业绩预告，预计上半年归母净利润亏损6000万-9000万元，同比转亏，主因铜价高位运行导致线缆原材料成本大幅上升、毛利率承压。公司作为全球首个750kV超高压电缆国际标准的主导制定者，在超高压电缆领域保持技术领先地位。远程股份为宜兴深市主板上市线缆企业。",

function switchMode(m){
  MODE=m;
  document.getElementById('tabDay').classList.toggle('on',m==='day');
  document.getElementById('tabHist').classList.toggle('on',m==='hist');
  document.getElementById('dayView').style.display=m==='day'?'block':'none';
  document.getElementById('histView').style.display=m==='hist'?'block':'none';
  if(m==='hist'){renderHist();}
  else{renderDay();}
  window.scrollTo({top:0,behavior:'smooth'});
}

function switchView(v){

  renderDay();
  window.scrollTo({top:0,behavior:'smooth'});
}

    var data=DATA_CHAIN;
    cntEl.textContent=data.length;
    var tiers=[
      {k:'tier1',n:'🏛️ 传统优势支柱',d:'电线电缆 · 节能环保'},
      {k:'tier2',n:'🚀 战略新兴主导',d:'集成电路 · 新能源 · 生命健康 · 新材料'},
      {k:'tier3',n:'🌱 未来培育',d:'通用人工智能 · 高端装备'}

        htmlstr+='<div class="grp '+tl.k+'"><span>'+tl.n+'</span><span class="gn">'+tl.d+' · '+tr.length+' 条</span></div>';

    cntEl.textContent=data.length;
    var tracks=[];
    data.forEach(function(d){if(tracks.indexOf(d.track)<0)tracks.push(d.track)});
    tracks.forEach(function(tk,i){
      var tr=data.filter(function(d){return d.track===tk});
      var col=TRACK_COLORS[i%TRACK_COLORS.length];
      htmlstr+='<div class="grp track" style="background:'+col+';border-left-color:rgba(0,0,0,.22)"><span>🎯 '+tk+'</span><span class="gn">'+tr.length+' 条</span></div>';
      htmlstr+=tr.map(function(d){return cardHTML(d,true)}).join('');
    });
  }
  listEl.innerHTML=htmlstr||'<div class="empty">暂无动态</div>';
}

function renderHist(){
  var q=qEl?qEl.value.trim().toLowerCase():'';
  var i=fInd?fInd.value:'',t=fType?fType.value:'',c=fCity?fCity.value:'',co=fCo?fCo.value:'';
  var rows=HISTORY.filter(function(d){
    return(!i||d.ind===i)&&(!t||(d.t1||d.type)===t)&&(!c||(d.city||'宜兴')===c)&&(!co||d.co===co)&&(!q||(d.co+d.title+d.rel).toLowerCase().includes(q));
  });
  document.getElementById('histCnt').textContent=rows.length;
  var htmlstr='';
  var dates=[];
  rows.forEach(function(d){if(dates.indexOf(d.cdate)<0)dates.push(d.cdate)});
  dates.forEach(function(dt){
    var dr=rows.filter(function(d){return d.cdate===dt});
    htmlstr+='<div class="grp hist"><span>📋 '+dt+'</span><span class="gn">'+dr.length+' 条</span></div>';
    htmlstr+=dr.map(function(d){
      return '<div class="hist-card">'+
        '<div class="hc-co">'+d.co+' <span style="font-size:11px;color:var(--sub);font-weight:400">'+d.ind+' · '+(d.t1||d.type)+'</span></div>'+
        '<div class="hc-title">'+d.title+'</div>'+
        '<div class="hc-rel">💡 '+d.rel+'</div>'+
        '<div class="hc-meta"><a href="'+d.url+'" target="_blank" style="color:var(--brand2)">来源：'+d.src+'</a></div>'+
      '</div>';
    }).join('');
  });
  document.getElementById('histList').innerHTML=htmlstr||'<div class="empty">没有匹配的历史动态</div>';
}

function render(){renderDay();}

if(qEl)qEl.addEventListener('input',function(){if(MODE==='hist')renderHist()});
if(fInd)fInd.addEventListener('change',function(){if(MODE==='hist')renderHist()});
if(fType)fType.addEventListener('change',function(){if(MODE==='hist')renderHist()});
if(fCity)fCity.addEventListener('change',function(){if(MODE==='hist')renderHist()});
if(fCo)fCo.addEventListener('change',function(){if(MODE==='hist')renderHist()});

function reset(){
  if(qEl)qEl.value='';
  if(fInd)fInd.value='';
  if(fType)fType.value='';
  if(fCity)fCity.value='';
  if(fCo)fCo.value='';
  if(MODE==='hist')renderHist(); else renderDay();
}

function exportXLSX(){
  var data=MODE==='hist'?HISTORY:allData;
  var ws=XLSX.utils.json_to_sheet(data.map(function(d){
    return{日期:d.cdate||'2026-08-01',企业:d.co,产业:d.ind,分类:d.t1||d.type,标题:d.title,启示:d.rel,来源:d.src,链接:d.url};
  }));
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'宜兴企业动态');
  XLSX.writeFile(wb,'宜兴企业动态_'+(MODE==='hist'?'历史':'当日')+'_20260801.xlsx');
}

render();

</script>
</body>
